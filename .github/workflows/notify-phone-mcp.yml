name: Notify Phone MCP Sync

on:
  push:
    branches: [main]
    paths:
      - "plugins/phone_use/**"
      - "helper-apk/**"
      - "phone-policy.yaml"
      - "sync/phone-control-manifest.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      PHONE_MCP_SYNC_TOKEN: ${{ secrets.PHONE_MCP_SYNC_TOKEN }}
    steps:
      - name: Trigger downstream sync
        if: env.PHONE_MCP_SYNC_TOKEN != ''
        run: |
          curl --fail-with-body --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${PHONE_MCP_SYNC_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Ctrl-Creeper/phone-mcp-server/dispatches \
            --data '{"event_type":"hermes-phone-sync","client_payload":{"source_ref":"${{ github.sha }}"}}'

      - name: Explain scheduled fallback
        if: env.PHONE_MCP_SYNC_TOKEN == ''
        run: |
          echo "PHONE_MCP_SYNC_TOKEN is not configured."
          echo "phone-mcp-server's scheduled workflow will still detect this update."
